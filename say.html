<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hello Sayli ❤️</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #ffd1dc, #ff80ab);
            font-family: "Poppins", sans-serif;
            overflow: hidden;
            color: #ffffff; /* Default text color */
        }

        h1 {
            font-size: 3rem;
            text-align: center;
            color: #ffffff;
            text-shadow: 0px 0px 20px rgba(255, 255, 255, 0.7);
        }

        .heart {
            font-size: 2.5rem;
            animation: beat 1s infinite;
            display: inline-block;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>

<body>

    <h1>
        Hello Sayli <span class="heart">❤️</span><br>
        How are you?
    </h1>

</body>
</html>
