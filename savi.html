<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Message for Savi</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#6ee7b7;
      --text:#e6eef6;
      --muted:#a7b3c7;
      --shadow: 0 8px 30px rgba(3,7,18,0.6);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 600px at 10% 20%, rgba(110,231,183,0.06), transparent 8%),
                  radial-gradient(1000px 500px at 90% 80%, rgba(99,102,241,0.04), transparent 8%),
                  var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }

    .card{
      width:100%;
      max-width:820px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:14px;
      box-shadow:var(--shadow);
      padding:34px;
      border: 1px solid rgba(255,255,255,0.03);
      transform: translateY(0);
      transition:transform .25s ease, box-shadow .25s ease;
      position:relative;
      overflow:hidden;
    }
    .card:hover{ transform: translateY(-6px); box-shadow: 0 20px 50px rgba(2,6,23,0.7); }

    header{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:18px;
    }

    .avatar {
      width:58px;
      height:58px;
      border-radius:10px;
      background: linear-gradient(135deg, #334155, #111827);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:600;
      color:var(--accent);
      font-size:18px;
      box-shadow: 0 6px 18px rgba(2,6,23,0.6);
      border: 1px solid rgba(255,255,255,0.02);
    }

    h1{
      font-size:22px;
      letter-spacing: -0.2px;
      color:var(--text);
      margin-bottom:4px;
    }
    p.subtitle{
      color:var(--muted);
      font-size:13px;
    }

    .message {
      margin-top:18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:12px;
      padding:20px;
      border: 1px solid rgba(255,255,255,0.03);
    }

    .message p{
      font-size:18px;
      color:var(--text);
      line-height:1.55;
      margin-bottom:12px;
    }

    .message small{
      display:block;
      color:var(--muted);
      font-size:13px;
    }

    .actions{
      margin-top:18px;
      display:flex;
      gap:12px;
    }

    .btn{
      padding:10px 14px;
      border-radius:10px;
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      color:var(--text);
      font-weight:600;
      cursor:pointer;
      transition: all .18s ease;
    }
    .btn.primary{
      background: linear-gradient(90deg,var(--accent),#60a5fa);
      color:#07211a;
      border:none;
      box-shadow: 0 8px 30px rgba(58,123,213,0.08);
    }
    .btn:hover{ transform:translateY(-3px); }

    /* subtle pulse for the greeting box (no hearts) */
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(110,231,183,0.06); }
      70% { box-shadow: 0 0 0 18px rgba(110,231,183,0); }
      100% { box-shadow: 0 0 0 0 rgba(110,231,183,0); }
    }

    .pulse {
      animation: pulse 2.8s ease-in-out infinite;
      border-radius:12px;
    }

    /* responsive */
    @media (max-width:560px){
      .card{ padding:20px; }
      .avatar{ width:48px;height:48px;font-size:16px; }
      h1{ font-size:18px; }
      .message p { font-size:16px; }
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="pageTitle">
    <header>
      <div class="avatar" aria-hidden="true">SV</div>
      <div>
        <h1 id="pageTitle">A quick note for Savi</h1>
        <p class="subtitle">A friendly check-in from your classmate</p>
      </div>
    </header>

    <section class="message pulse" aria-live="polite">
      <p><strong>Hi Savi —</strong> we missed you in V class today. Is everything okay? Why were you absent?</p>
      <small>If you'd like, reply here or message me directly. I hope you're doing well.</small>

      <div class="actions" style="margin-top:12px;">
        <button class="btn primary" onclick="copyText()">Copy message</button>
        <button class="btn" onclick="openChat()">Message Savi</button>
      </div>
    </section>
  </main>

  <script>
    function copyText(){
      const text = "Hi Savi — we missed you in V class today. Is everything okay? Why were you absent?";
      navigator.clipboard?.writeText(text).then(()=>{
        alert("Message copied to clipboard — paste it to send to Savi.");
      }).catch(()=>{ alert("Could not copy — please copy manually."); });
    }

    function openChat(){
      alert("Open your preferred chat app and paste the message to contact Savi.");
    }
  </script>
</body>
</html>
